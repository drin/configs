# ------------------------------
# Environment related settings

# for tmux titles when SSH'ing
set -g set-titles        on
set -g set-titles-string "#T"

set -g automatic-rename on
set -g monitor-activity on
set -g mouse            on

set -g default-terminal "tmux"
set -g mode-keys        vi


# ------------------------------
# Keybindings

set -g prefix ^Space

# ^b is a terrible default prefix
unbind -n ^b
unbind -n ^a

# let's use ctl + spacebar instead!
bind ^Space send-prefix

# window motions
bind n      new-window
bind h      previous-window
bind l      next-window
bind r      rotate-window -U

# split window into panes
bind v      split-window -h
bind s      split-window -v

# pane motions
bind ^h     select-pane -L
bind ^l     select-pane -R
bind ^j     select-pane -D
bind ^k     select-pane -U


# ------------------------------
# Style

set -g window-style        'bg=#6b7282,fg=#a5abb6'
set -g window-active-style 'bg=#2e3440,fg=#d8dee9'

set -g pane-border-style        'bg=#b48ead,fg=#a3be8c'
set -g pane-active-border-style 'bg=#b48ead,fg=#a3be8c'


# ------------------------------
# Plugins

set -g @plugin "arcticicestudio/nord-tmux"

run '/opt/homebrew/opt/tpm/share/tpm/tpm'
